[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-r"
version = "0.4.0rc3"
description = "Risk-controlled T+1 post-trade exception resolution benchmark and product framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jinwoo Bae"}]
keywords = ["machine-learning", "model-risk", "post-trade", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux"
]

dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.20,<3"
]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
orchestration = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4"
]

[project.scripts]
finops-r = "finops_r.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finops_r = ["dataset_registry.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/finops_r"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.coverage.run]
source = ["finops_r"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
